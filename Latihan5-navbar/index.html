<!DOCKTYPE>
<html>
<head>
	<title>Latihan Navbar</title>
	<style>
	.navbar {
		position: flex;
		width: 100%;
		color: white;
		background-color: #222;
		height: 60px;
		display: flex;
		top: 0;
		box-sizing: border-box;
		z-index: 1000;
		align-items: center;
		justify-content: space-between;
		padding-right: 30px
		border-radius: 20px 20px 0 0
	}
	
	.nav-links {
		list-style: none;
		display: flex;
		gap: 25px;
	}
	
	.nav-links li a {
		color: #f4f4f9;
		text-decoration: none;
		font-size: 17px;
		transition" 0.3s;
		
		background-color: gray;
		color: white;
		padding: 10px 20px;
		border-radius: 10%;
	}
	
	.nav-links li a:hover {
		background-color: white;
		color: black;
	}
	
	#content {
		padding: 80px 20px;
		background: linear-gradient(135deg, #6a5af9, #5ac8fa);
		color: white;
		box-shadow: 0 10px 25px rgba(0,0,0,0.15);
		border-radius:0 0 20px 20px
		
	}
	
	.logo {
		color: white;
		text-shadow: 0 0 7px #fff, 0 0 21px #ff00de;
		margin-left: 10px;
		font-size: 21px;
		font-weight: bold;
		background-color: gray;
		border-radius: 50%;
	}
	</style>
</head>
<body>
	<nav class="navbar">
	<div class="logo">
		VP
	</div>
		<ul class="nav-links">
			<li><a href="#">Beranda</a></li>
			<li><a href="../Latihan4/latihan4.html">Profil</a></li>
			<li><a href="#">Kontak</a></li>
			<li><a href="#">Data Pengunjung</a></li>
		</ul>
	</nav>
	<section id="content">
		<h1>Selamat Datang!</h1>
		<p>Semoga menikmati web saya :)</p>
	</section>
</body>
</html>
